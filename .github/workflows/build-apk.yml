name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      # Regenerate the Android folder with the current Flutter template.
      # The committed Android files were made by an older Flutter and fail
      # with the current Gradle setup.
      - name: Regenerate Android scaffolding
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example --project-name tele_birr_ui .
          # Use the older Gradle DSL that the Flutter Gradle plugin supports.
          echo "android.newDsl=false" >> android/gradle.properties

      - run: flutter pub get

      # connectivity_plus 1.4.0 has no Android namespace, which current Gradle requires.
      # Add it to the downloaded plugin before building.
      - name: Patch connectivity_plus namespace
        run: |
          f="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/connectivity_plus-1.4.0/android/build.gradle"
          sed -i "s/^android {/android {\n    namespace 'dev.fluttercommunity.plus.connectivity'/" "$f"
          grep -n "namespace" "$f"

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
