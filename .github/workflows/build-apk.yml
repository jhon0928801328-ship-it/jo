name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Regenerate the Android folder with the current Flutter template.
      # The committed Android files were made by an older Flutter and fail
      # with the current Gradle setup.
      - name: Regenerate Android scaffolding
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example --project-name tele_birr_ui .

      - run: flutter pub get

      # connectivity_plus 1.4.0 lacks an Android namespace and breaks the current build.
      - run: flutter pub upgrade connectivity_plus

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
