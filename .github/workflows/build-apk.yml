name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      # Regenerate the Android folder with the current Flutter template.
      # The committed Android files were made by an older Flutter and fail
      # with the current Gradle setup.
      - name: Regenerate Android scaffolding
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example --project-name tele_birr_ui .
          # Use the older Gradle DSL that the Flutter Gradle plugin supports.
          echo "android.newDsl=false" >> android/gradle.properties

      - run: flutter pub get

      # Patch Flutter plugins for the current Gradle setup:
      # - raise old Kotlin 1.3.50 versions (used by nb_utils) to 1.8.22
      # - add the Android "namespace" that current Gradle requires, from each plugin's manifest
      - name: Patch plugins for current Gradle
        run: |
          python3 - <<'EOF'
          import json, os, re
          KOTLIN = re.compile(r"((?:kotlin[-_]?version\s*=\s*['\"])|(?:kotlin-gradle-plugin:))1\.3\.50")
          cfg = json.load(open('.dart_tool/package_config.json'))
          for pkg in cfg['packages']:
              root = pkg['rootUri']
              if root.startswith('file://'):
                  root = root[len('file://'):]
              root = os.path.normpath(os.path.join('.dart_tool', root))
              android = os.path.join(root, 'android')
              manifest = os.path.join(android, 'src', 'main', 'AndroidManifest.xml')
              for name in ('build.gradle', 'build.gradle.kts'):
                  gradle = os.path.join(android, name)
                  if not os.path.isfile(gradle):
                      continue
                  text = open(gradle).read()
                  new = KOTLIN.sub(lambda m: m.group(1) + '1.8.22', text)
                  if new != text:
                      open(gradle, 'w').write(new)
                      text = new
                      print('kotlin raised in', gradle)
                  if not os.path.isfile(manifest):
                      continue
                  if re.search(r'^\s*namespace\b', text, re.M) or not re.search(r'^\s*android\s*\{', text, re.M):
                      continue
                  m = re.search(r'package="([^"]+)"', open(manifest).read())
                  if not m:
                      continue
                  ns = m.group(1)
                  line = 'namespace = "%s"' % ns if name.endswith('.kts') else "namespace '%s'" % ns
                  text = re.sub(r'^(\s*)android\s*\{', lambda x: x.group(0) + '\n' + x.group(1) + '    ' + line, text, count=1, flags=re.M)
                  open(gradle, 'w').write(text)
                  print('namespace', ns, 'added to', gradle)
          EOF

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
